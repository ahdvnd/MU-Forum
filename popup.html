<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minerva Forum Assistant</title>
  <style>
    body {
      width: 350px;
      min-height: 400px;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8f9fa;
    }

    .header {
      background: #2c5aa0;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
    }

    .header p {
      margin: 5px 0 0 0;
      font-size: 12px;
      opacity: 0.9;
    }

    .content {
      padding: 20px;
    }

    .status-card {
      background: white;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
      border: 1px solid #e0e0e0;
    }

    .status-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .status-item:last-child {
      margin-bottom: 0;
    }

    .status-label {
      font-size: 13px;
      color: #666;
    }

    .status-value {
      font-size: 13px;
      font-weight: 600;
    }

    .status-value.success {
      color: #28a745;
    }

    .status-value.error {
      color: #dc3545;
    }

    .status-value.warning {
      color: #ffc107;
    }

    .btn {
      width: 100%;
      background: #2c5aa0;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 10px;
      transition: background-color 0.2s;
    }

    .btn:hover {
      background: #1e3f73;
    }

    .btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: #6c757d;
    }

    .btn-secondary:hover {
      background: #5a6268;
    }

    .quick-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 15px;
    }

    .stat-card {
      background: white;
      border-radius: 6px;
      padding: 12px;
      text-align: center;
      border: 1px solid #e0e0e0;
    }

    .stat-number {
      font-size: 20px;
      font-weight: 700;
      color: #2c5aa0;
      display: block;
    }

    .stat-label {
      font-size: 11px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .warning-message {
      background: #fff3cd;
      border: 1px solid #ffeaa7;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 15px;
      font-size: 12px;
      color: #856404;
    }

    .success-message {
      background: #d4edda;
      border: 1px solid #c3e6cb;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 15px;
      font-size: 12px;
      color: #155724;
    }

    .loading {
      text-align: center;
      color: #666;
      font-style: italic;
      padding: 20px;
    }

    .footer {
      text-align: center;
      padding: 15px;
      font-size: 11px;
      color: #999;
      border-top: 1px solid #e0e0e0;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Minerva Assistant</h1>
    <p>AI-powered grading for instructors</p>
  </div>

  <div class="content">
    <div id="loading" class="loading">
      Loading status...
    </div>

    <div id="main-content" style="display: none;">
      <div class="quick-stats">
        <div class="stat-card">
          <span id="responses-count" class="stat-number">0</span>
          <span class="stat-label">Responses</span>
        </div>
        <div class="stat-card">
          <span id="analyzed-count" class="stat-number">0</span>
          <span class="stat-label">Analyzed</span>
        </div>
      </div>

      <div class="status-card">
        <div class="status-item">
          <span class="status-label">Current Page:</span>
          <span id="page-status" class="status-value">Unknown</span>
        </div>
        <div class="status-item">
          <span class="status-label">API Key:</span>
          <span id="api-key-status" class="status-value">Not Set</span>
        </div>
        <div class="status-item">
          <span class="status-label">Rubric:</span>
          <span id="rubric-status" class="status-value">Not Set</span>
        </div>
      </div>

      <div id="warning-container"></div>
      <div id="success-container"></div>

      <button id="show-sidebar" class="btn">Show Sidebar</button>
      <button id="configure-settings" class="btn btn-secondary">Configure Settings</button>
      <button id="refresh-data" class="btn btn-secondary">Refresh Data</button>
    </div>
  </div>

  <div class="footer">
    Version 1.0.0 • Made for Minerva Forum
  </div>

  <script src="popup.js"></script>
</body>
</html>
