<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minerva Forum Assistant</title>
  <style>
    body {
      width: 380px;
      min-height: 360px;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: hsl(0 0% 100%);
      font-size: 14px;
      line-height: 1.5;
    }

    .header {
      background: hsl(0 0% 100%);
      color: hsl(222.2 84% 4.9%);
      padding: 24px;
      text-align: center;
      border-bottom: 1px solid hsl(214.3 31.8% 91.4%);
    }

    .header h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.025em;
    }

    .header p {
      margin: 6px 0 0 0;
      font-size: 14px;
      color: hsl(215.4 16.3% 46.9%);
    }

    .content {
      padding: 24px;
    }

    .status-card {
      background: hsl(210 40% 98%);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid hsl(214.3 31.8% 91.4%);
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .status-card:hover {
      background: hsl(210 40% 96%);
    }

    .status-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .status-item:last-child {
      margin-bottom: 0;
    }

    .status-label {
      font-size: 14px;
      color: hsl(215.4 16.3% 46.9%);
      font-weight: 500;
    }

    .status-value {
      font-size: 14px;
      font-weight: 600;
    }

    .status-value.success {
      color: hsl(142.1 76.2% 36.3%);
    }

    .status-value.error {
      color: hsl(0 62.8% 30.6%);
    }

    .status-value.warning {
      color: hsl(38.4 92% 50%);
    }

    .btn {
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      border: 1px solid transparent;
      padding: 12px 16px;
      height: 40px;
      background: hsl(222.2 84% 4.9%);
      color: hsl(210 40% 98%);
      margin-bottom: 12px;
      text-decoration: none;
      user-select: none;
    }

    .btn:hover {
      background: hsl(222.2 84% 4.9% / 0.9);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn:disabled {
      background: hsl(214.3 31.8% 91.4%);
      color: hsl(215.4 16.3% 46.9%);
      cursor: not-allowed;
    }

    .btn-secondary {
      background: hsl(210 40% 98%);
      color: hsl(222.2 84% 4.9%);
      border: 1px solid hsl(214.3 31.8% 91.4%);
    }

    .btn-secondary:hover {
      background: hsl(210 40% 96%);
    }


    .warning-message {
      background: hsl(38.4 92% 50% / 0.1);
      border: 1px solid hsl(38.4 92% 50% / 0.3);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
      font-size: 14px;
      color: hsl(25 95% 53%);
      line-height: 1.5;
    }

    .success-message {
      background: hsl(142.1 76.2% 36.3% / 0.1);
      border: 1px solid hsl(142.1 76.2% 36.3% / 0.3);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
      font-size: 14px;
      color: hsl(142.1 76.2% 36.3%);
      line-height: 1.5;
    }

    .loading {
      text-align: center;
      color: hsl(215.4 16.3% 46.9%);
      padding: 32px 24px;
      font-size: 14px;
    }

    .footer {
      text-align: center;
      padding: 16px 24px;
      font-size: 12px;
      color: hsl(215.4 16.3% 46.9%);
      border-top: 1px solid hsl(214.3 31.8% 91.4%);
      background: hsl(210 40% 98%);
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Minerva Assistant</h1>
    <p>AI-powered grading for instructors</p>
  </div>

  <div class="content">
    <div id="loading" class="loading">
      Loading status...
    </div>

    <div id="main-content" style="display: none;">
      <div class="status-card">
        <div class="status-item">
          <span class="status-label">Current Page:</span>
          <span id="page-status" class="status-value">Unknown</span>
        </div>
        <div class="status-item">
          <span class="status-label">API Key:</span>
          <span id="api-key-status" class="status-value">Not Set</span>
        </div>
        <div class="status-item">
          <span class="status-label">Rubric:</span>
          <span id="rubric-status" class="status-value">Not Set</span>
        </div>
      </div>

      <div id="course-info-card" class="status-card" style="display: none;">
        <div class="status-item">
          <span class="status-label">Course ID:</span>
          <span id="course-id" class="status-value">-</span>
        </div>
        <div class="status-item">
          <span class="status-label">Section ID:</span>
          <span id="section-id" class="status-value">-</span>
        </div>
        <div class="status-item">
          <span class="status-label">Class ID:</span>
          <span id="class-id" class="status-value">-</span>
        </div>
      </div>

      <div id="warning-container"></div>
      <div id="success-container"></div>

      <button id="show-sidebar" class="btn">Show Sidebar</button>
      <button id="show-analytics" class="btn" style="display: none;">Show Analytics</button>
      <button id="configure-settings" class="btn btn-secondary">Configure Settings</button>
      <button id="refresh-data" class="btn btn-secondary">Refresh Data</button>
    </div>
  </div>

  <div class="footer">
    Version 1.2.7 • Made for Minerva Forum
  </div>

  <script src="popup.js"></script>
</body>
</html>
